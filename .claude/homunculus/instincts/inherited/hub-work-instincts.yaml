# Hub Work Workflow Install Or Configure Agent Extension

## Action

Follow the install-or-configure-agent-extension workflow:
1. Add new skill definitions under agent skill directories (e.g., .agents/skills/speckit-*/SKILL.md, .claude/skills/gitnexus/*).
2. Add or update configuration/manifest files (e.g., .specify/extensions.yml, .specify/integration.json, .specify/integrations/*.manifest.json).
3. Add workflow scripts and templates (e.g., .specify/scripts/bash/*.sh, .specify/templates/*.md, .specify/workflows/*).
4. Update documentation files (e.g., AGENTS.md, CLAUDE.md).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .agents/skills/*/SKILL.md, .claude/skills/*/SKILL.md, .specify/extensions.yml

