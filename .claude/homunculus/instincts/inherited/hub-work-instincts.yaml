# Hub Work Workflow Add Skill To Agent

## Action

Follow the add-skill-to-agent workflow:
1. Create a new directory under .agent/skills/, .agents/skills/, or .claude/skills/ with the skill name.
2. Add SKILL.md (skill definition) and optionally DESIGN.md or other documentation.
3. Add supporting scripts (e.g., scripts/*.js, scripts/*.sh, scripts/*.py) and data files (e.g., data/*.csv) as needed.
4. If relevant, replicate the skill under multiple agent directories (e.g., .agent/skills/, .agents/skills/, .claude/skills/).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .agent/skills/*/SKILL.md, .agents/skills/*/SKILL.md, .claude/skills/*/SKILL.md

